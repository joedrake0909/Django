{% extends 'myapp/base.html' %}
{% block content %} 
   <div>
        {% for item in item_list %}
            <div class="m-10 flex w-1/2 mx-auto">
                <div>
                    <img class="w-64 rounded-lg" src="{{ item.item_image }}" alt="Image">
                </div>

                <div class="mx-15">
                    <div class="font-bold">{{item.item_name}}</div>
                    <div>{{item.item_desc}}</div>
                    <div class="text-green-700 font-bold ">${{item.item_price}}</div>

                </div>  

                <div>
                    <a class="bg-red-500 font-bold text-white px-4 py-2 rounded-md" href="{% url 'myapp:detail' item.id %}">View Details</a> 
                </div>


            </div>

            

            
        
        {% endfor %}

   </div>

    
{% endblock %}
